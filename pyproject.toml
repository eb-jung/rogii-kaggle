[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogii-research"
version = "0.1.0"
description = "Leakage-aware offline wellbore regression"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scikit-learn", "lightgbm", "scipy", "joblib"]

[tool.setuptools.packages.find]
where = ["src"]
